name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app/src/main/java/com/oyun/kutuphane app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OyunKutuphanem"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.oyun.kutuphane'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.oyun.kutuphane'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.activity:activity:1.9.0'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Oyun Kütüphanem"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/oyun/kutuphane/MainActivity.kt <<'EOF'
          package com.oyun.kutuphane

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : ComponentActivity() {
              private lateinit var web: WebView
              private var pending: ValueCallback<Array<Uri>>? = null

              private val picker = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val uris = if (r.resultCode == Activity.RESULT_OK)
                      WebChromeClient.FileChooserParams.parseResult(r.resultCode, r.data) else null
                  pending?.onReceiveValue(uris)
                  pending = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? =
                          loader.shouldInterceptRequest(request.url)
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView, callback: ValueCallback<Array<Uri>>, params: FileChooserParams
                      ): Boolean {
                          pending?.onReceiveValue(null)
                          pending = callback
                          return try { picker.launch(params.createIntent()); true }
                          catch (e: Exception) { pending = null; false }
                      }
                  }
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          val js = "(function(){var p=document.getElementById('playM');" +
                              "if(p.classList.contains('show')){document.getElementById('closePlay').click();return 1}" +
                              "var m=document.querySelectorAll('.modal.show');" +
                              "if(m.length){m[0].classList.remove('show');return 1}return 0})()"
                          web.evaluateJavascript(js) { r -> if (r != "1") finish() }
                      }
                  })
              }
          }
          EOF
          base64 -d > app/src/main/assets/index.html <<'EOF'
          
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OyunKutuphanem-apk
          path: app/build/outputs/apk/debug/app-debug.apk
